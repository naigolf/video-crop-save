name: Crop Watermark and Trim Video

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'Target Gist ID'
        required: true
      crop_bottom_px:
        description: 'จำนวนพิกเซลที่ต้องการตัดขอบล่างออก (Default: 60)'
        required: false
        default: '60'
      trim_end_seconds:
        description: 'จำนวนวินาทีที่ต้องการตัดท้ายคลิปออก (Default: 4)'
        required: false
        default: '4'

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Download & Decode Video
        env:
          GH_TOKEN: ${{ secrets.MY_GIST_TOKEN }}
          GIST_ID: ${{ inputs.gist_id }}
        run: |
          # 1. ดึงไฟล์ input.txt จาก Gist
          gh gist view $GIST_ID --filename input.txt > input_base64.txt
          
          # 2. Decode กลับเป็นไฟล์วิดีโอ input.mp4
          base64 -d input_base64.txt > input.mp4

      - name: Process Video (Crop Bottom & Trim End)
        run: |
          # 1. ตรวจสอบความยาวคลิป
          TOTAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4)
          echo "Original Duration: $TOTAL_DURATION seconds"
          
          # 2. คำนวณเวลาตัดท้ายคลิปออก
          TRIM_SEC="${{ inputs.trim_end_seconds }}"
          TARGET_DURATION=$(python3 -c "print(max(0, float('$TOTAL_DURATION') - float('$TRIM_SEC')))")
          echo "Target Duration: $TARGET_DURATION seconds"

          # 3. ดึงขนาดความกว้าง (Width) และความสูง (Height) ดั้งเดิมของวิดีโอ
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 input.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 input.mp4)
          echo "ตรวจพบขนาดวิดีโอต้นฉบับ: ${WIDTH}x${HEIGHT}"

          CROP_PX="${{ inputs.crop_bottom_px }}"

          # 4. เช็คว่าเป็นแนวตั้ง หรือ แนวนอน (ปรับ preset ให้ไฟล์ไม่บวมใหญ่เกินไป)
          if [ "$HEIGHT" -gt "$WIDTH" ]; then
            echo "🎬 วิดีโอแนวตั้ง (Portrait เช่น 720x1280)"
            ffmpeg -i input.mp4 -t "$TARGET_DURATION" \
              -vf "crop=iw:ih-${CROP_PX}:0:0,scale=${WIDTH}:${HEIGHT}" \
              -c:v libx264 -preset veryfast -crf 26 -c:a aac output.mp4
          else
            echo "🖥️ วิดีโอแนวนอน (Landscape เช่น 1280x720)"
            ffmpeg -i input.mp4 -t "$TARGET_DURATION" \
              -vf "crop=iw:ih-${CROP_PX}:0:0,scale=${WIDTH}:${HEIGHT}" \
              -c:v libx264 -preset veryfast -crf 26 -c:a aac output.mp4
          fi

          echo "✅ ประมวลผลเสร็จสิ้น ขนาดสุดท้ายคืนค่าเดิมเป็น: ${WIDTH}x${HEIGHT}"

      - name: Encode & Upload Result
        env:
          GH_TOKEN: ${{ secrets.MY_GIST_TOKEN }}
          GIST_ID: ${{ inputs.gist_id }}
        run: |
          # 1. แปลงไฟล์เป็น Base64
          base64 -w 0 output.mp4 > output.txt

          # 2. อัปโหลดเข้า Gist ผ่าน Git Push โดยตรง (แก้ปัญหาไฟล์ใหญ่เกิน 10MB ของ Gist API)
          git clone "https://${GH_TOKEN}@gist.github.com/${GIST_ID}.git" gist_repo
          cp output.txt gist_repo/output.txt
          cd gist_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.txt
          git commit -m "Upload processed video output"
          git push
          echo "✅ อัปโหลดผลลัพธ์เข้า Gist สำเร็จเรียบร้อย!"
